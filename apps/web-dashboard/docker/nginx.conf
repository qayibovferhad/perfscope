# PerfScope dashboard — static bundle, plus a proxy to the backend on the same origin.
#
# Serving the API from the dashboard's own origin is the point of this file, not a
# convenience: the bundle then needs no backend URL baked into it, the browser sends no
# preflight, and the RUM snippet a customer pastes on their own site points at one public
# host. The backend's CORS origin (CLIENT_URL) still has to name that host.

upstream perfscope_backend {
    # `backend` is the compose service name; Docker's embedded DNS resolves it. Named as
    # an upstream rather than inlined so the read timeouts below have one place to live.
    server backend:3101;
    keepalive 16;
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # The backend also compresses, but it never sees these files.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml;

    # A stored audit result is hundreds of KB of JSON and arrives through the proxy.
    client_max_body_size 2m;

    # Liveness for this container only. Deliberately not `/health` — that name is the
    # backend's and is proxied below, so a container check on it would report the backend's
    # state and keep nginx out of rotation for someone else's outage.
    location = /_healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Written at container start from the environment. It must never be cached: a browser
    # holding yesterday's copy would keep yesterday's backend URL after a redeploy.
    location = /env.js {
        # One header, not two: `expires -1` would add a `Cache-Control: no-cache` of its
        # own beside this one, and two conflicting values is a thing to debug later.
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Content-hashed by Vite, so they can be cached for as long as a browser will hold them.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The RUM collector script, served at the root by the backend and loaded from other
    # people's sites. Its own location because it is the one proxied path that is not /api.
    location = /rum.js {
        proxy_pass http://perfscope_backend;
        include    /etc/nginx/conf.d/proxy-headers.inc;
    }

    location = /health {
        proxy_pass http://perfscope_backend;
        include    /etc/nginx/conf.d/proxy-headers.inc;
        access_log off;
    }

    location /api/ {
        proxy_pass http://perfscope_backend;
        include    /etc/nginx/conf.d/proxy-headers.inc;

        # `POST /api/analyze` holds its connection open for the whole audit — the route
        # raises its own timeout to RUN_TIMEOUT_MS + 60s, and a proxy that gave up at
        # nginx's 60s default would turn a working audit into a 504 for the caller.
        proxy_read_timeout    330s;
        proxy_send_timeout    330s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
    }

    location /socket.io/ {
        proxy_pass http://perfscope_backend;
        include    /etc/nginx/conf.d/proxy-headers.inc;

        # The websocket upgrade. Without these three lines Socket.io still "works" by
        # falling back to long-polling, which is the kind of failure nobody notices until
        # progress events arrive in batches.
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # An audit streams progress for minutes with quiet stretches between phases.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # The backend's metrics are internal. This is not a proxy rule that was forgotten: the
    # SPA fallback below would answer /metrics with index.html and a 200, so a scraper
    # pointed at the public URL would report the service as up while reading HTML. An
    # explicit 404 says what is true — there are no metrics on this origin.
    location = /metrics {
        return 404;
    }

    # Client-side routing: /history, /report/<token> and the rest are not files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself is the one file that must not be cached, or a deploy's new asset
    # hashes are never asked for.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
