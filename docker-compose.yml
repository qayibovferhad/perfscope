# ─────────────────────────────────────────────────────────────────────────────
# PerfScope — local infrastructure only.
#
# This compose file deliberately does NOT containerize the backend or the web
# apps: they run on the host via `pnpm dev` because auditing http://localhost
# is a first-class development case (the containerised stack refuses it — the
# SSRF guard is on with NODE_ENV=production), the auth-audit flow needs a real
# desktop to log in on, and hot-reload works best outside a container.
#
# For the deployment — both apps in images, Chromium inside the backend one —
# see `docker-compose.prod.yml` and `docs/deploy/DOCKER.md`.
#
# Usage:
#   docker compose up -d    # start MongoDB
#   pnpm dev                # start backend + web dashboard + extension on host
#
# MongoDB is optional — the backend runs analyses without it; only history
# persistence is skipped when it is unavailable.
# ─────────────────────────────────────────────────────────────────────────────

services:
  mongo:
    image: mongo:7
    container_name: perfscope-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
