<!doctype html>
<!--
  A page that fails on purpose, so the audit-list filters and the element screenshots have
  something real to work on.

  Every failure here is one Lighthouse detects automatically and files under a *different*
  accessibility group — contrast, names and labels, internationalization, ARIA — which is
  what makes the grouped view worth asserting. It also fails a couple of SEO audits, so the
  category filter has more than one category to switch between.

  The failing elements are deliberately *visible*: a first version used a 1×1 transparent
  GIF and 12px grey-on-white text, and the cropped thumbnails came out as blank strips —
  technically correct and useless to look at. An element screenshot is only worth taking of
  something a person can recognise.

  Deliberately no <html lang> — that is one of the findings.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Deliberately inaccessible fixture</title>
  <style>
    body { background: #ffffff; font-family: system-ui, -apple-system, sans-serif; padding: 40px; max-width: 860px; }
    .card { background: #f4f4f5; border-radius: 12px; padding: 28px; margin: 24px 0; }
    /* Contrast ratio ~1.6:1 — fails WCAG AA, and fails it measurably. Large enough that
       the crop shows the actual text rather than a grey smear. */
    .faint { color: #d0d0d0; background: #ffffff; font-size: 34px; font-weight: 700; margin: 0 0 12px; }
    .also-faint { color: #dcdcdc; background: #f4f4f5; font-size: 22px; margin: 0; }
    .cta { background: #2563eb; border: none; border-radius: 10px; width: 190px; height: 54px; cursor: pointer; }
    .field { width: 320px; height: 46px; font-size: 16px; padding: 0 12px; border: 2px solid #94a3b8; border-radius: 8px; }
    .submit { width: 140px; height: 46px; background: #16a34a; border: none; border-radius: 8px; color: #fff; }
    .toggle { display: inline-block; background: #f59e0b; color: #1f2937; font-weight: 700;
              padding: 14px 26px; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <!-- Contrast: two real headings a crop can show. -->
  <div class="card">
    <p class="faint">Barely visible heading</p>
    <p class="also-faint">This paragraph does not have enough contrast against its background either.</p>
  </div>

  <!-- Names and labels: a visible image with no alt text, and a real button with no text
       inside it. Both crop into something recognisable. -->
  <div class="card">
    <img
      src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNDAiIGhlaWdodD0iMTQwIj48cmVjdCB3aWR0aD0iMjQwIiBoZWlnaHQ9IjE0MCIgZmlsbD0iI2RjMjYyNiIvPjxjaXJjbGUgY3g9IjcwIiBjeT0iNzAiIHI9IjM2IiBmaWxsPSIjZmRlMDQ3Ii8+PHJlY3QgeD0iMTMwIiB5PSI0MCIgd2lkdGg9IjcwIiBoZWlnaHQ9IjYwIiBmaWxsPSIjMDZiNmQ0Ii8+PC9zdmc+"
      width="240" height="140">
    <br>
    <button class="cta"></button>
  </div>

  <!-- Names and labels: a form field with nothing naming it, and a submit with no value. -->
  <div class="card">
    <form>
      <input class="field" type="text" name="email">
      <input class="submit" type="submit" value="">
    </form>
  </div>

  <!-- ARIA: a role that requires children it does not have, and an invalid attribute value. -->
  <div class="card">
    <div role="list"></div>
    <div class="toggle" role="button" aria-expanded="not-a-boolean" tabindex="0">Toggle the panel</div>
  </div>

  <!-- Navigation: a link whose text says nothing about where it goes. -->
  <p><a href="/somewhere">click here</a></p>

  <p class="also-faint">
    No meta description, no lang attribute, and a viewport that is never declared — the SEO
    and best-practices categories have something to report too.
  </p>
</body>
</html>
