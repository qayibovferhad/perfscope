name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Puppeteer's Chrome-for-Testing download is unreliable from GitHub runners
# ("All providers failed"), so both jobs skip it at install time; the e2e job
# provides a system Chrome via setup-chrome and points puppeteer (backend
# Lighthouse + e2e tests) at it through PUPPETEER_EXECUTABLE_PATH.
env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (all workspaces)
        run: pnpm build

      - name: Typecheck (all workspaces)
        # `pnpm build` only typechecks the packages whose build *is* tsc. The extension
        # builds through WXT and the dashboard through Vite, so neither ever had its types
        # checked in CI — this is the step that closes that.
        run: pnpm typecheck

      - name: Lint (all workspaces)
        run: pnpm lint

      - name: Test
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    # The budget step below is our own action, and it writes back: a check run on the commit
    # and, on a pull request, one comment it keeps updating. Both are refused silently
    # without these — a token's default permissions depend on a repository setting.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Create backend .env
        # Drop the placeholder GEMINI_API_KEY so AI insights are cleanly disabled,
        # then pin the CI Mongo/JWT settings.
        run: |
          grep -v '^GEMINI_API_KEY=' apps/backend/.env.example > apps/backend/.env
          {
            echo "MONGODB_URI=mongodb://localhost:27017/perfscope"
            echo "JWT_SECRET=ci-secret"
          } >> apps/backend/.env

      - name: Build shared package
        # Both dev servers import @perfscope/shared from its dist output.
        run: pnpm --filter @perfscope/shared build

      - name: Start dev servers
        # Invoke the package scripts directly — `turbo dev` hangs in non-TTY CI.
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          pnpm --filter @perfscope/backend dev > /tmp/backend.log 2>&1 &
          pnpm --filter @perfscope/web-dashboard dev > /tmp/web.log 2>&1 &

      - name: Wait for servers
        run: |
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:5173 && curl -sf -o /dev/null http://localhost:3101/health; then
              echo "both servers up"
              exit 0
            fi
            sleep 2
          done
          echo "servers did not come up in time"
          tail -n 50 /tmp/backend.log /tmp/web.log
          exit 1

      - name: Run e2e smoke tests
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm e2e

      - name: Create the account the budget check audits as
        id: ci-account
        # A refresh token rather than an access token: access tokens live 30 minutes, and a
        # pipeline that pauses on a queued runner would find it expired. The CLI mints its
        # own per run. Read out of `data` — every route answers `{success, data}`.
        run: |
          BODY=$(curl -s -X POST http://localhost:3101/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci-budget@example.com","password":"ci-password"}')
          REFRESH=$(node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const b=JSON.parse(d);console.log(b.data?.refreshToken??'')}catch{console.log('')}})" <<< "$BODY")
          if [ -z "$REFRESH" ]; then echo "could not obtain a session"; echo "$BODY" | head -c 400; exit 1; fi
          echo "::add-mask::$REFRESH"
          echo "refresh-token=$REFRESH" >> "$GITHUB_OUTPUT"

      - name: Check the dashboard's own performance budget
        # Dogfooding, twice over: the CLI audits the dev server it just booted, through the
        # same socket pipeline the app uses — and it does it through *our own action*, so
        # the thing we ship to other people's pipelines is the thing that runs in ours.
        #
        # `cli-path` runs the CLI from this checkout instead of npm, which is what makes the
        # action testable here before a release. Budgets are deliberately loose: a GitHub
        # runner is slower and noisier than any real host, so this is a smoke test for a
        # catastrophic regression, not a performance gate.
        # No PUPPETEER_EXECUTABLE_PATH here: the CLI launches no browser. The backend does,
        # and it was started with it above.
        uses: ./packages/action
        with:
          url: http://localhost:5173
          api-url: http://localhost:3101
          budget: performance=20,lcp=15000,cls=0.5
          tunnel: 'false'
          refresh-token: ${{ steps.ci-account.outputs.refresh-token }}
          cli-path: packages/cli/bin/cli.js
          check-name: PerfScope budget (dashboard)

      - name: Show server logs on failure
        if: failure()
        run: tail -n 100 /tmp/backend.log /tmp/web.log
