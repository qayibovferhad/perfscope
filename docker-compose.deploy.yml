# ─────────────────────────────────────────────────────────────────────────────
# PerfScope — what runs on a server.
#
# This file pulls published images instead of building, so the host needs no checkout,
# no Node and no pnpm: just this file, a `.env.docker` beside it, and Docker.
#
#   scp docker-compose.deploy.yml .env.docker you@host:/opt/perfscope/
#   ssh you@host
#   cd /opt/perfscope
#   export IMAGE_TAG=v1.0.0      # or main-<sha>; `latest` only exists for v* tags
#   docker compose --env-file .env.docker -f docker-compose.deploy.yml pull
#   docker compose --env-file .env.docker -f docker-compose.deploy.yml up -d
#
# `.github/workflows/release.yml` runs exactly those three commands over SSH once
# DEPLOY_HOST is configured. Confirm a deploy with `curl https://host/health` — the
# `version` field is the image tag, so a restart of the old container is distinguishable
# from a new one.
#
# Container names are left to compose (`perfscope-mongo-1` and so on) rather than fixed:
# a fixed `perfscope-mongo` is the same name `docker-compose.yml` uses, and starting this
# stack on a development machine would then recreate that container without its published
# 27017 — which is how a host `pnpm dev` loses its database.
#
# It is a separate file rather than an override of `docker-compose.prod.yml` on purpose:
# that one names a build context this host does not have. The environment blocks are
# therefore duplicated — prod is the one to edit first, and this one follows it.
# ─────────────────────────────────────────────────────────────────────────────
name: perfscope

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Backups ──────────────────────────────────────────────────────────────
  # A dump a day into a named volume, fourteen days kept. It is a `mongo:7` container
  # because that image already has mongodump, and it reaches the database over the compose
  # network rather than a published port.
  #
  # This is a *local* window, not an off-site backup: the archives sit on the same host and
  # the same disk as the data. Copying them somewhere else is the operator's job and is the
  # one thing that makes them survive the machine — docs/deploy/BACKUP.md says how, and
  # says plainly that nothing here does it.
  mongo-backup:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/perfscope
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - mongo-backups:/backups
      # Copied to the host beside this file — `scp scripts/mongo-backup.sh you@host:/opt/perfscope/`.
      # A deployed host has no checkout, and inlining the loop here would be a second copy
      # of the script to keep in step with the first.
      - ./mongo-backup.sh:/usr/local/bin/mongo-backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/mongo-backup.sh"]
    depends_on:
      mongo:
        condition: service_healthy

  # Off-host copies, off by default.
  #
  # `docker compose --profile offsite -f docker-compose.prod.yml up -d` starts it; without
  # the profile it does not exist. The archives beside the database protect against a bad
  # migration; only this protects against losing the machine, and it is opt-in because it
  # needs a bucket and credentials that nobody has by default.
  #
  # S3-compatible, not S3: BACKUP_S3_ENDPOINT points it at MinIO, R2, Spaces or anything
  # else that speaks the same API — which is also how it was tested (see BACKUP.md).
  backup-offsite:
    # `:latest` because AWS publishes no `:2` tag on Docker Hub, only `:latest` and full
    # versions — an image that does not exist fails at `up`, not at review.
    image: amazon/aws-cli:latest
    profiles: ["offsite"]
    restart: unless-stopped
    environment:
      # Plain `${...:-}`, not `${...:?}`: compose interpolates the whole file even for an
      # `up` that does not include this profile, so a required-variable marker here would
      # stop every ordinary start. The script below refuses to run without them instead.
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
    volumes:
      # Read-only: this container copies archives out and must never be able to delete one.
      - mongo-backups:/backups:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        BUCKET="${BACKUP_S3_BUCKET:-}"
        [ -n "$$BUCKET" ] || { echo "[backup-offsite] BACKUP_S3_BUCKET is not set - nothing to sync to"; exit 1; }
        [ -n "$${AWS_ACCESS_KEY_ID:-}" ] || { echo "[backup-offsite] BACKUP_S3_ACCESS_KEY is not set"; exit 1; }
        PREFIX="${BACKUP_S3_PREFIX:-perfscope}"
        ENDPOINT="${BACKUP_S3_ENDPOINT:-}"
        INTERVAL="${BACKUP_SYNC_INTERVAL_HOURS:-6}"
        [ -n "$$ENDPOINT" ] && ARGS="--endpoint-url $$ENDPOINT" || ARGS=""
        echo "[backup-offsite] syncing /backups to s3://$$BUCKET/$$PREFIX every $${INTERVAL}h"
        while true; do
          # `sync`, not `cp`: it uploads what is new and leaves what is already there, so a
          # restart does not re-upload the whole window. Deletions are NOT mirrored — the
          # local retention is 14 days and the remote copy is the one that should outlive it.
          if aws $$ARGS s3 sync /backups "s3://$$BUCKET/$$PREFIX" --exclude '*.partial'; then
            echo "[backup-offsite] $$(date -u +%Y-%m-%dT%H:%M:%SZ) synced"
          else
            echo "[backup-offsite] $$(date -u +%Y-%m-%dT%H:%M:%SZ) FAILED - will retry"
          fi
          sleep $$((INTERVAL * 3600))
        done

  backend:
    # IMAGE_REPO is the GHCR path without the `-backend`/`-web` suffix, i.e.
    # ghcr.io/<owner>/<repo>. IMAGE_TAG has no default: a deploy has to say which build it
    # is deploying, and `latest` silently reinstalling last month's image is the failure
    # this avoids.
    image: ${IMAGE_REPO:?set IMAGE_REPO, e.g. ghcr.io/qayibovferhad/perfscope}-backend:${IMAGE_TAG:?set IMAGE_TAG, e.g. v1.0.0 or main-<sha>}
    restart: unless-stopped
    # Every audit spawns Chrome processes and PID 1 has to reap them.
    init: true
    environment:
      NODE_ENV: production
      PORT: "3101"
      MONGODB_URI: mongodb://mongo:27017/perfscope
      # The address people type — the CORS origin and the origin the Socket.io handshake
      # is checked against. Not the service name.
      CLIENT_URL: ${PUBLIC_URL:?set PUBLIC_URL to the public address, e.g. https://perfscope.example.com}
      JWT_SECRET: ${JWT_SECRET:?set it in .env.docker and pass --env-file .env.docker}
      MAX_CONCURRENT_AUDITS: ${MAX_CONCURRENT_AUDITS:-2}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CRUX_API_KEY: ${CRUX_API_KEY:-}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-PerfScope Alerts <alerts@perfscope.local>}
    depends_on:
      mongo:
        condition: service_healthy

  web:
    image: ${IMAGE_REPO:?}-web:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      # Empty = same origin: this container's nginx proxies /api, /socket.io and /rum.js
      # to the backend. Written into /env.js at start-up, so no rebuild to change it.
      BACKEND_URL: ${BACKEND_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    # Bound to localhost when a reverse proxy on the host terminates TLS, which is the
    # normal arrangement: set WEB_BIND=127.0.0.1 and point nginx/Caddy/Traefik at it.
    # Leave it empty to publish on every interface (plain HTTP, no certificate).
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mongo-data:
  mongo-backups:
